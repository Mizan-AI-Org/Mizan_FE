<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <script>
    // Dark is the default. Applied before paint so there is no light flash,
    // and only skipped when someone has explicitly chosen light.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light") document.documentElement.classList.add("dark");
    })();
  </script>
  <title>Mizan AI - Operations OS</title>
  <meta name="description"
    content="AI-native operating system for business operations. Understand what is happening, decide what matters, and execute work." />
  <meta name="author" content="Mizan AI" />
  <meta name="theme-color" content="#56BC6D" />

  <link rel="icon" type="image/svg+xml" href="/mizan-mark.svg" />
  <link rel="apple-touch-icon" href="/mizan-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet" />

  <!-- Warm up connections used during first paint to shave ~200–400ms on cold starts -->
  <link rel="preconnect" href="https://api.heymizan.ai" crossorigin />
  <link rel="dns-prefetch" href="https://api.heymizan.ai" />
  <link rel="preconnect" href="https://api.fish.audio" crossorigin />
  <link rel="dns-prefetch" href="https://api.fish.audio" />

  <!-- Start fetching the initial locale file in parallel with JS (i18n useSuspense needs it) -->
  <link rel="preload" href="/locales/en.json" as="fetch" type="application/json" crossorigin />

  <meta property="og:title" content="Mizan AI - Operations OS" />
  <meta property="og:description"
    content="AI-native operating system for business operations. Understand what is happening, decide what matters, and execute work." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/mizan-logo.png" />

  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <!-- Fish Audio Miya - no external LuaPop script needed -->
  <!-- Notifications disabled: Service worker registration removed -->
</body>

</html>
